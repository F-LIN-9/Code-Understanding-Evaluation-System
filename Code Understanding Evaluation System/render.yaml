services:
  - type: web
    name: codeassess
    runtime: python
    plan: free
    region: singapore
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python run.py"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CODEASSESS_DATA_DIR
        value: /opt/render/project/src/data
      - key: CODEASSESS_LLM_BASE
        sync: false
      - key: CODEASSESS_LLM_KEY
        sync: false
      - key: CODEASSESS_LLM_MODEL
        sync: false